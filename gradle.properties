org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build Advisor's native on-device model backend (Qwen3-4B via llama.cpp, libadvisor-llm.so).
# Off by default: it requires the Android NDK + CMake and fetches llama.cpp at configure time. When
# off, the app still builds and runs, using Advisor's deterministic placeholder engine. Flip to true
# (or pass -Padvisor.buildNativeLlm=true) to compile the real backend.
# advisor.buildNativeLlm=true

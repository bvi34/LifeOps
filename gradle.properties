org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Build Advisor's native on-device model backend (Qwen3-4B via llama.cpp, libadvisor-llm.so).
# Enabled here so the real on-device model actually runs (the imported GGUF is loaded through the
# native runtime instead of falling back to the deterministic placeholder). This REQUIRES the Android
# NDK + CMake 3.22.1 (install via the SDK Manager) and internet access at configure time — the build
# fetches llama.cpp (tag b5600) and compiles libadvisor-llm.so for arm64-v8a, so first builds are
# slower and the APK is larger. If a machine lacks the NDK/CMake, override for that build with
# -Padvisor.buildNativeLlm=false to fall back to the placeholder engine.
advisor.buildNativeLlm=true
